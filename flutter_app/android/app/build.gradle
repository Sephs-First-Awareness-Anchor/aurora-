plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.chaquo.python"
}

// ── Ensure Python directory exists at configuration time ──────────────
File pythonDir = file("src/main/python")
if (!pythonDir.exists()) {
    pythonDir.mkdirs()
}

// ── Copy Aurora Python modules into the standard python srcDir ──────────────
task preparePythonSources {
    def repoRoot = file("../../..")
    def destDir  = file("src/main/python")

    // Gradle 8 strict validation: exclude Flutter/Gradle build output dirs from
    // the input declaration so there is no apparent overlap with the outputs of
    // compileFlutterBuildRelease and buildKotlinToolingMetadata, which also
    // write into the repo root tree.  The Python sources we actually copy never
    // live in those subdirectories, so the exclusion is semantically correct.
    inputs.files fileTree(repoRoot) {
        include "**/*.py"
        include "aurora_manifold_directory/**"
        include "aurora_internal/**/*.json"
        include "aurora_genealogy/**"
        include "*.py"
        exclude "**/__pycache__/**"
        exclude "**/*.pyc"
        exclude "aurora_mobile.py"
        exclude "flutter_app/**"
        exclude ".dart_tool/**"
        exclude "build/**"
        exclude ".gradle/**"
        exclude ".idea/**"
        // APK size: tests/ and scripts/ are never imported by Aurora's boot
        // sequence (pytest and direct CLI invocation run them, nothing in
        // the app does) -- 191 files / ~37K lines that were being bundled
        // into every release for no runtime reason.
        exclude "tests/**"
        exclude "scripts/**"
    }
    outputs.dir destDir

    doFirst {
        destDir.mkdirs()
    }

    doLast {
        // Copy canonical engine from aurora_internal/
        copy {
            // Recursive **/*.py glob must exclude flutter_app/** -- destDir
            // (src/main/python) lives INSIDE repoRoot/flutter_app/android/app,
            // so without this exclusion each run recursively copies its own
            // previous output back into itself, growing the nesting depth
            // one level deeper every invocation until a path exceeds the
            // filesystem's max filename length ("File name too long").
            // inputs.files above already excludes flutter_app/** for the
            // same reason; this copy action needs the identical exclusion.
            from(repoRoot) {
                include "**/*.py"
                exclude "**/__pycache__/**"
                exclude "flutter_app/**"
                exclude "tests/**"
                exclude "scripts/**"
            }
            into destDir
        }
        // Expose aurora_internal at top level so bridge imports work unchanged:
        //   from aurora_internal.X import Y  →  src/main/python/aurora_internal/
        // Also include its *.json data (universal_function_constraints.json,
        // universal_function_lineage.json, lineage_canonical_generated.json) --
        // lineage_canonical.py and aurora_universal_function_lineage.py load
        // these relative to aurora_internal's own directory at runtime, and a
        // .py-only copy silently left them missing on-device.
        copy {
            from("${repoRoot}/aurora_internal") {
                include "**/*.py"
                include "**/*.json"
                exclude "**/__pycache__/**"
            }
            into "${destDir}/aurora_internal"
        }
        // Manifold directory — King Quasicrystal identity field data + Python package
        copy {
            from(repoRoot) {
                include "aurora_manifold_directory/**"
                exclude "**/__pycache__/**"
            }
            into destDir
        }
        // Genealogy fossil record (abilities/couplings/links/pair_stats.json) --
        // has no .py files of its own, so the broad **/*.py copy above never
        // touched it, even though aurora_internal/aurora_operator_composer.py
        // (instantiated at boot in aurora.py) reads aurora_genealogy/couplings.json
        // relative to this same repo root.
        copy {
            from(repoRoot) {
                include "aurora_genealogy/**"
            }
            into destDir
        }
        // All root-level runtime modules. Exclude only test/debug/tooling scripts
        // that are never imported by Aurora's boot sequence.
        // aurora_mobile.py is excluded — replaced by aurora_bridge.py on Android.
        copy {
            from(repoRoot) {
                include "*.py"
                exclude "aurora_mobile.py"
                exclude "test_*.py"
                exclude "_*test*.py"
                exclude "debug_*.py"
                exclude "run_*.py"
                exclude "fix_*.py"
                exclude "refactor_*.py"
                exclude "generate_*.py"
                exclude "sentinel*.py"
                exclude "chatscriber.py"
                exclude "crystalzip*.py"
                exclude "clean_*.py"
                exclude "swap_*.py"
                exclude "append_*.py"
                exclude "process_docs.py"
                exclude "force_evolve.py"
                exclude "seed_*.py"
                exclude "termux_*.py"
                exclude "arena_compare.py"
            }
            into destDir
        }
    }
}

preBuild.dependsOn preparePythonSources

tasks.configureEach { task ->
    if (task.name ==~ /merge.*PythonSources/) {
        task.dependsOn preparePythonSources
    }
}

android {
    namespace      "org.aurora.app"
    compileSdkVersion 34
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    sourceSets {
        main.python.srcDir "src/main/python"
    }

    defaultConfig {
        applicationId "org.aurora.app"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        // APK size: x86_64 exists for emulator/rare x86 device compatibility,
        // not real phone hardware (which this app targets). Chaquopy bundles
        // a full native Python interpreter + numpy/Pillow's compiled .so
        // libraries PER ABI, so this was roughly doubling that entire
        // payload for a target this app doesn't ship to. arm64-v8a alone
        // covers essentially all real Android phones since ~2018.
        ndk { abiFilters "arm64-v8a" }

        python {
            version "3.12"
            buildPython "python3"
            pip {
                install "requests==2.25.1"
                install "python-dateutil==2.9.0.post0"
                install "pytz==2022.1"
                // psutil was installed but never imported anywhere in the
                // live codebase (confirmed via repo-wide grep) -- pure
                // dead weight, including its own compiled C extension.
                install "numpy==1.26.2"
                install "Pillow"
            }
            // APK size: ship only compiled .pyc, not the .py source --
            // Aurora's Python tree is ~450 files after tests/scripts were
            // already excluded above; no runtime reason to also carry the
            // source text once it's compiled.
            pyc {
                src false
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file(System.getenv("HOME") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def ksFile = file(System.getenv("HOME") + "/.android/release.keystore")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("RELEASE_STORE_PASS") ?: ""
                keyAlias     System.getenv("RELEASE_KEY_ALIAS")  ?: ""
                keyPassword  System.getenv("RELEASE_KEY_PASS")   ?: ""
            } else {
                // Fall back to debug key when no release keystore is present
                storeFile file(System.getenv("HOME") + "/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // APK size: R8 code shrinking + resource shrinking. Chaquopy
            // ships its own consumer ProGuard rules (its AAR is designed
            // to survive minification) and no third-party Flutter plugins
            // are used (camera/TTS/STT here are hand-written Kotlin, not
            // plugin packages, so no GeneratedPluginRegistrant reflection
            // risk) -- proguard-rules.pro below adds explicit keep rules
            // for the Chaquopy bridge and app package as defense in depth.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// ── Disable strict validation on Chaquopy's generated merge tasks ──
tasks.withType(org.gradle.api.tasks.Copy).configureEach { task ->
    if (task.name.contains("mergePython")) {
        task.doFirst {
            // Ensure output directory exists before validation
            task.outputs.files.each { it.mkdirs() }
        }
    }
}

flutter { source "../.." }

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    // CameraX — Aurora visual sensory intake
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"

    // Repair Q (per Sunni, 2026-08-19): on-device face detection for
    // proximity/gaze awareness. ML Kit specifically (not cv2/Haar) --
    // aurora_bridge.py's cv2 shim's CascadeClassifier is a deliberate
    // no-op stub (confirmed by reading it directly), since real OpenCV
    // isn't bundled through Chaquopy on this stack. ML Kit runs natively
    // in Kotlin, on the raw camera frame, with no Python round-trip
    // needed for the detection itself -- only the resulting bounding
    // box crosses the bridge.
    implementation "com.google.mlkit:face-detection:16.1.6"
}
