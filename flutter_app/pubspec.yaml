name: aurora_app
description: Aurora AI Assistant — production Flutter app
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Repair R (per Sunni, 2026-08-19): "providing me a way to upload files
  # and audio and pictures she then receives and processes." Real,
  # widely-used cross-platform file selection -- no native Android code
  # needed for the picker UI itself, only for what happens after
  # (uploadContent in MainActivity.kt/AuroraService.kt).
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # APK size: the 8 PNGs previously listed here (aurora_orb, aurora_bg,
  # aurora_waves, strand_cyan/blue/purple/pink/warm, ~8.4MB total) are
  # leftover from earlier avatar designs -- the current face
  # (lib/widgets/aurora_orb.dart) is drawn entirely with CustomPaint, no
  # image assets. Confirmed zero references anywhere in lib/ before
  # removal.
