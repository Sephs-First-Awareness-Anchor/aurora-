name: One-shot phone regression repair v3

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply v2 guarded repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          raw = Path('.github/workflows/one-shot-phone-regression-repair-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = raw.index(start_marker) + len(start_marker)
          end = raw.index(end_marker, start)
          code = textwrap.dedent(raw[start:end])
          exec(compile(code, '<guarded-phone-repair-v2>', 'exec'), {})
          PY

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile and test
        shell: bash
        run: |
          python -m py_compile aurora.py aurora_boundary_hypothesis.py \
            aurora_internal/aurora_constraint_semantic_continuity.py \
            flutter_app/android/app/src/main/python/aurora_bridge.py
          pytest -q \
            tests/test_boundary_hypothesis_and_vocative_stripping.py \
            tests/test_boundary_surface_and_study_trace_regressions.py \
            tests/test_android_surface_subsurface_reconnection.py \
            tests/test_constraint_semantic_continuity.py

      - name: Commit repair and remove one-shot runners
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/one-shot-phone-regression-repair.yml \
            .github/workflows/one-shot-phone-regression-repair-pr.yml \
            .github/workflows/one-shot-phone-regression-repair-v2.yml \
            .github/workflows/one-shot-phone-regression-repair-v3.yml
          git add aurora.py aurora_boundary_hypothesis.py \
            aurora_internal/aurora_constraint_semantic_continuity.py \
            flutter_app/android/app/src/main/python/aurora_bridge.py \
            flutter_app/lib/screens/hub_screen.dart \
            tests/test_boundary_hypothesis_and_vocative_stripping.py \
            tests/test_android_surface_subsurface_reconnection.py
          git commit -m "fix: close confirmed phone turn regressions"
          git push origin HEAD:${{ github.head_ref }}
