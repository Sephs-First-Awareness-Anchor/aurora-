name: One-shot phone regression repair v2

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply guarded repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match in {path}, found {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('applied:', label)

          # aurora.py vocative address forms
          replace_once(
              'aurora.py',
              '_VOCATIVE_ADDRESS_LEAD_RE = re.compile(\n    r"^(?:hey|hi|hello|yo)[\\s,]+aurora\\b[\\s,]*",\n    re.IGNORECASE,\n)\n',
              '_VOCATIVE_ADDRESS_LEAD_RE = re.compile(\n    r"^(?:hey|hi|hello|yo)[\\s,]+aurora\\b[\\s,]*",\n    re.IGNORECASE,\n)\n_VOCATIVE_NAME_ADDRESS_RE = re.compile(\n    r"^(?:(?:well|so|okay|ok|um+|uh+)[\\s,]+)?aurora"\n    r"(?:\\s*,\\s*|\\s+(?=(?:what|who|whom|whose|which|where|when|why|how|"\n    r"can|could|would|will|tell|show|give|explain|describe)\\b))",\n    re.IGNORECASE,\n)\n',
              'vocative-regex',
          )
          replace_once(
              'aurora.py',
              '    stripped = _VOCATIVE_ADDRESS_RE.sub("", raw)\n    if stripped == raw:\n        stripped = _VOCATIVE_ADDRESS_LEAD_RE.sub("", raw)\n    stripped = stripped.strip()\n',
              '    stripped = _VOCATIVE_ADDRESS_RE.sub("", raw)\n    if stripped == raw:\n        stripped = _VOCATIVE_ADDRESS_LEAD_RE.sub("", raw)\n    if stripped == raw:\n        stripped = _VOCATIVE_NAME_ADDRESS_RE.sub("", raw)\n    stripped = stripped.strip()\n',
              'vocative-use',
          )

          # phone curly apostrophes
          replace_once(
              'aurora_internal/aurora_constraint_semantic_continuity.py',
              '    low = str(value or "").strip().lower()\n',
              '    low = str(value or "").strip().lower().replace("\\u2018", "\'").replace("\\u2019", "\'")\n',
              'curly-base-relation',
          )
          replace_once(
              'aurora_internal/aurora_constraint_semantic_continuity.py',
              'def _tokens(text: Any) -> List[str]:\n    return re.findall(r"[A-Za-z]+(?:\'[A-Za-z]+)?|\\d+(?:\\.\\d+)?", str(text or ""))\n',
              'def _tokens(text: Any) -> List[str]:\n    source = str(text or "").replace("\\u2018", "\'").replace("\\u2019", "\'")\n    return re.findall(r"[A-Za-z]+(?:\'[A-Za-z]+)?|\\d+(?:\\.\\d+)?", source)\n',
              'curly-tokenizer',
          )

          # explicit-only hypothesis resolution
          p = Path('aurora_boundary_hypothesis.py')
          text = p.read_text(encoding='utf-8')
          old_import = 'from typing import Any, Dict, Optional\n\nfrom aurora_referent_hypothesis import _BARE_NEGATIVE_LEAD, _CORRECTION_MARKERS\n'
          new_import = '''import re
          from typing import Any, Dict, Optional

          from aurora_referent_hypothesis import _BARE_NEGATIVE_LEAD, _CORRECTION_MARKERS

          _EXPLICIT_CONFIRMATION_LEAD = re.compile(
              r"^\\s*(?:yes|yeah|yep|yup|exactly|correct|"
              r"(?:that's|that is)\\s+(?:right|correct|what i meant)|you got it)\\b",
              re.IGNORECASE,
          )
          '''
          if text.count(old_import) != 1:
              raise SystemExit('boundary-import: anchor mismatch')
          text = text.replace(old_import, new_import, 1)
          start = text.index('def check_and_resolve_pending_boundary_hypothesis(\n')
          new_fn = '''def check_and_resolve_pending_boundary_hypothesis(
              systems: Dict[str, Any],
              new_user_text: str,
          ) -> Optional[Dict[str, Any]]:
              """Resolve a pending boundary hypothesis only from an actual signal.

              Correction and confirmation must both be explicit. A topic change,
              unrelated answer, or simple absence of correction clears the probe
              without awarding developmental confirmation: silence is not evidence.
              """
              if not isinstance(systems, dict):
                  return None
              pending = systems.get("_pending_boundary_hypothesis")
              if not pending:
                  return None
              systems["_pending_boundary_hypothesis"] = None

              text_low = str(new_user_text or "").lower()
              was_corrected = (
                  any(marker in text_low for marker in _CORRECTION_MARKERS)
                  or bool(_BARE_NEGATIVE_LEAD.match(text_low))
              )
              was_confirmed = bool(_EXPLICIT_CONFIRMATION_LEAD.match(text_low))

              outcome = dict(pending)
              if was_corrected:
                  outcome["corrected"] = True
                  outcome["resolved"] = True
              elif was_confirmed:
                  outcome["corrected"] = False
                  outcome["resolved"] = True
              else:
                  outcome["corrected"] = None
                  outcome["resolved"] = False
                  outcome["unanswered"] = True
                  return outcome

              try:
                  from aurora_developmental_log import record_developmental_event
                  pieces = " / ".join(
                      f"{k}={pending.get(k)!r}" for k in ("subject", "relation", "obj") if pending.get(k)
                  )
                  record_developmental_event(
                      systems,
                      "boundary_hypothesis_corrected" if was_corrected else "boundary_hypothesis_confirmed",
                      (f"guessed the shape of an unresolved question ({pieces})"
                       + (" -- corrected by user" if was_corrected else " -- explicitly confirmed by user")),
                      once=False,
                  )
              except Exception:
                  pass
              return outcome
          '''
          p.write_text(text[:start] + new_fn, encoding='utf-8')
          print('applied: boundary-explicit-resolution')

          # Android bridge admission and diagnostics
          bridge = 'flutter_app/android/app/src/main/python/aurora_bridge.py'
          replace_once(
              bridge,
              '_SURFACE_WAIT_TIMEOUT_S: float = 90.0\n',
              '_SURFACE_WAIT_TIMEOUT_S: float = 90.0\n_TURN_ADMISSION_TIMEOUT_S: float = 180.0\n',
              'admission-timeout-constant',
          )
          replace_once(
              bridge,
              '    "surface_received", "surface_processing", "surface_expressed",\n',
              '    "surface_received", "surface_queued", "surface_processing", "surface_expressed",\n',
              'diagnostic-queued-state',
          )
          replace_once(
              bridge,
              '        _systems["_current_turn_id"] = _turn_id\n        _record_turn_state(_turn_id, "surface_received", user_text=text[:100])\n',
              '        _record_turn_state(_turn_id, "surface_received", user_text=text[:100])\n',
              'defer-current-turn-id',
          )
          replace_once(
              bridge,
              '        _box_event = threading.Event()\n        _box_state = {"text": "", "delivered": False}\n',
              '        _box_event = threading.Event()\n        _processing_started = threading.Event()\n        _box_state = {"text": "", "delivered": False}\n',
              'processing-start-event',
          )
          replace_once(
              bridge,
              '                _record_turn_state(_turn_id, "empty_expression", error=str(_aurora_boundary_exc))\n\n            _route_late = False\n',
              '                _record_turn_state(_turn_id, "empty_expression", error=str(_aurora_boundary_exc))\n\n            # This callback is the real Surface/Subsurface seam.\n            _record_turn_state(_turn_id, "subsurface_active")\n\n            _route_late = False\n',
              'subsurface-real-seam',
          )
          replace_once(
              bridge,
              '            try:\n                _record_turn_state(_turn_id, "surface_processing")\n                with _lock:\n                    result = _aurora.process_external_user_turn(\n',
              '            try:\n                if _lock.locked():\n                    _record_turn_state(_turn_id, "surface_queued")\n                with _lock:\n                    _systems["_current_turn_id"] = _turn_id\n                    _record_turn_state(_turn_id, "surface_processing")\n                    _processing_started.set()\n                    result = _aurora.process_external_user_turn(\n',
              'admission-before-surface-processing',
          )
          replace_once(
              bridge,
              '                response = _box_state["text"]\n                _record_turn_state(_turn_id, "subsurface_active")\n',
              '                response = _box_state["text"]\n',
              'remove-late-subsurface-marker',
          )
          replace_once(
              bridge,
              '        _surface_arrived = _box_event.wait(_SURFACE_WAIT_TIMEOUT_S)\n        with _box_lock:\n            _box_state["delivered"] = True\n            response = _box_state["text"] if _surface_arrived else ""\n        if not _surface_arrived:\n            _record_turn_state(_turn_id, "timeout")\n        return response\n',
              '        _admitted = _processing_started.wait(_TURN_ADMISSION_TIMEOUT_S)\n        if not _admitted:\n            with _box_lock:\n                _box_state["delivered"] = True\n            _record_turn_state(_turn_id, "transport_failure", error="turn_admission_timeout")\n            return ""\n\n        _surface_arrived = _box_event.wait(_SURFACE_WAIT_TIMEOUT_S)\n        with _box_lock:\n            _box_state["delivered"] = True\n            response = _box_state["text"] if _surface_arrived else ""\n        if not _surface_arrived:\n            _record_turn_state(_turn_id, "timeout")\n        return response\n',
              'separate-queue-and-surface-timeouts',
          )

          # Hub wording
          replace_once(
              'flutter_app/lib/screens/hub_screen.dart',
              '  // Newest first; an entry whose last_state is still surface_received or\n  // surface_processing (never reached a terminal state) means that turn\n  // is/was genuinely stuck at that exact point -- the single most useful\n  // fact for triaging "she went silent."\n',
              '  // Newest first. surface_queued means the input is waiting behind the\n  // prior causal turn; surface_processing means this turn has actually entered\n  // Aurora\'s response path. Queue time is therefore distinct from a Surface stall.\n',
              'hub-queue-wording',
          )

          # Tests
          p = Path('tests/test_boundary_hypothesis_and_vocative_stripping.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '    _directive_boundary_surface,\n    _question_boundary_surface,\n    extract_relational_form,\n',
              '    _base_relation,\n    _directive_boundary_surface,\n    _question_boundary_surface,\n    _tokens,\n    extract_relational_form,\n',
              1,
          )
          text += '''

          def test_vocative_name_only_and_filler_forms_are_stripped_without_eating_content():
              assert aurora._strip_vocative_address("Aurora, what's up?") == "what's up?"
              assert aurora._strip_vocative_address("Okay Aurora, how are you?") == "how are you?"
              assert aurora._strip_vocative_address("So Aurora tell me something") == "tell me something"
              assert aurora._strip_vocative_address("Well Aurora, what do you think?") == "what do you think?"
              assert aurora._strip_vocative_address("Aurora is a great name") == "Aurora is a great name"


          def test_curly_phone_apostrophe_matches_ascii_contraction_path():
              assert _tokens("what’s up?") == ["what's", "up"]
              assert _base_relation("what’s") == "be"
              assert _base_relation("what's") == "be"


          def test_boundary_hypothesis_topic_change_is_not_false_confirmation(monkeypatch):
              import aurora_developmental_log
              events = []
              monkeypatch.setattr(
                  aurora_developmental_log,
                  "record_developmental_event",
                  lambda *args, **kwargs: events.append((args, kwargs)),
              )
              systems = {}
              _question_boundary_surface(
                  {"subject": "the plan", "relation": "requires", "obj": "budget"},
                  systems=systems,
              )
              outcome = check_and_resolve_pending_boundary_hypothesis(
                  systems, "anyway, what were we talking about before that?"
              )
              assert outcome["resolved"] is False
              assert outcome["corrected"] is None
              assert outcome["unanswered"] is True
              assert events == []
          '''
          p.write_text(text, encoding='utf-8')

          p = Path('tests/test_android_surface_subsurface_reconnection.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import time\n', 'import time\nimport threading\n', 1)
          text = text.replace(
              '    aurora_bridge._SURFACE_WAIT_TIMEOUT_S = 20.0\n',
              '    aurora_bridge._SURFACE_WAIT_TIMEOUT_S = 20.0\n    aurora_bridge._TURN_ADMISSION_TIMEOUT_S = 2.0\n',
              1,
          )
          text += '''

          def test_fast_followup_queue_does_not_spend_surface_timeout_or_overwrite_prior_turn_id(monkeypatch):
              aurora_bridge._SURFACE_WAIT_TIMEOUT_S = 0.05
              aurora_bridge._TURN_ADMISSION_TIMEOUT_S = 2.0
              release_first = threading.Event()

              def fake_process(systems, text, *, on_surface_ready=None, **kw):
                  resp_a = _FakeResp(f"Surface reply to: {text}")
                  on_surface_ready(resp_a)
                  if text == "first turn":
                      release_first.wait(1.0)
                  return {"resp_A": resp_a}

              monkeypatch.setattr(aurora, "process_external_user_turn", fake_process)
              assert aurora_bridge.handle_message("first turn") == "Surface reply to: first turn"
              first_id = aurora_bridge._systems["_current_turn_id"]
              assert "subsurface_active" in _states(first_id)

              second = {}
              thread = threading.Thread(
                  target=lambda: second.setdefault("reply", aurora_bridge.handle_message("second turn")),
                  daemon=True,
              )
              thread.start()
              time.sleep(0.12)
              assert aurora_bridge._systems["_current_turn_id"] == first_id

              all_diag = json.loads(aurora_bridge.get_live_turn_diagnostics())
              queued = [
                  e for e in all_diag
                  if e.get("states") and e["states"][0].get("user_text") == "second turn"
              ]
              assert len(queued) == 1
              queued_id = queued[0]["turn_id"]
              assert queued[0]["last_state"] == "surface_queued"
              assert "timeout" not in _states(queued_id)

              release_first.set()
              thread.join(1.5)
              assert not thread.is_alive()
              assert second["reply"] == "Surface reply to: second turn"
              assert aurora_bridge._systems["_current_turn_id"] == queued_id
              states = _states(queued_id)
              assert "surface_queued" in states
              assert "surface_processing" in states
              assert "surface_expressed" in states
              assert "subsurface_active" in states
              assert "timeout" not in states
          '''
          p.write_text(text, encoding='utf-8')
          print('applied: regression-tests')
          PY

      - name: Compile and test
        shell: bash
        run: |
          python -m py_compile aurora.py aurora_boundary_hypothesis.py \
            aurora_internal/aurora_constraint_semantic_continuity.py \
            flutter_app/android/app/src/main/python/aurora_bridge.py
          pytest -q \
            tests/test_boundary_hypothesis_and_vocative_stripping.py \
            tests/test_boundary_surface_and_study_trace_regressions.py \
            tests/test_android_surface_subsurface_reconnection.py

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aurora.py aurora_boundary_hypothesis.py \
            aurora_internal/aurora_constraint_semantic_continuity.py \
            flutter_app/android/app/src/main/python/aurora_bridge.py \
            flutter_app/lib/screens/hub_screen.dart \
            tests/test_boundary_hypothesis_and_vocative_stripping.py \
            tests/test_android_surface_subsurface_reconnection.py
          git commit -m "fix: close confirmed phone turn regressions"
          git push origin HEAD:${{ github.head_ref }}
