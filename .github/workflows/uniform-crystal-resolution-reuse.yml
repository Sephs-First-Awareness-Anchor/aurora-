name: Uniform crystal resolution and recall integration

on:
  pull_request:
    paths:
      - 'aurora_internal/crystal_facets.py'
      - 'aurora_internal/aurora_representation_crystals.py'
      - 'aurora_internal/aurora_representation_exchange.py'
      - 'aurora_internal/aurora_live_experience.py'
      - 'aurora_internal/aurora_confluence.py'
      - 'aurora_braid_wiring.py'
      - 'aurora_working_memory.py'
      - 'tests/test_uniform_crystal_resolution_reuse.py'
      - 'tests/test_crystal_facets.py'
      - '.github/workflows/uniform-crystal-resolution-reuse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      AURORA_SKIP_DEP_INSTALL: '1'
      AURORA_SKIP_HARDWARE_IMPORTS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.:flutter_app/android/app/src/main/python'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Aurora core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt pytest
      - name: One crystal, richer facets, no recollection vote
        run: python -m pytest -q --tb=short tests/test_uniform_crystal_resolution_reuse.py tests/test_crystal_facets.py tests/test_crystal_evidence_evolution.py
      - name: Representation crystal persistence and restored expectation
        run: python -m pytest -q --tb=short tests/test_representation_crystals.py -k 'an_earned_representation_is_a_facet or a_fresh_session_restores_from_the_crystals or the_exchange_keeps_no_file_of_its_own'
      - name: Reasoning, recall and communication regressions
        run: |
          python -m pytest -q --tb=short tests/test_representation_adoption.py -k 'communication_emergence_adopts_an_expectation or live_module_feeds_the_shared_runtime'
          python -m pytest -q --tb=short tests/test_understanding_sediment_overlay.py tests/test_one_speech_path.py
