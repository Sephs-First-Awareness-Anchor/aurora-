name: Python CI

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - '*.py'
      - 'aurora_internal/**'
      - 'tests/**'
      - 'requirements-core.txt'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - '*.py'
      - 'aurora_internal/**'
      - 'tests/**'
      - '.github/build725-repair/**'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: agent/build-724-learning-integration-repair
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Build 725 applicator and verification
        id: build725
        shell: bash
        run: |
          set +e
          LOG=/tmp/build725-python-ci.log
          : > "$LOG"
          {
            echo '=== install ==='
            python -m pip install --upgrade pip
            pip install -r requirements-core.txt
            pip install pytest numpy==1.26.4
            echo '=== apply ==='
            python .github/build725-repair/apply.py
            echo '=== syntax ==='
            python -m py_compile aurora.py foundational_contract.py
            find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 python -m py_compile
            echo '=== focused tests ==='
            python -m pytest -q \
              tests/test_build725_learning_integration_repair.py \
              tests/test_afterthought_topic_identity_and_shard_collision_repair.py \
              tests/test_afterthought_topic_identity_and_shard_collision_live.py \
              tests/test_native_motivation_binding_build723.py \
              tests/test_habitat_motivation_build717.py \
              tests/test_habitat_discovery_canary_build717.py \
              tests/test_habitat_self_and_shared_canaries_build717.py \
              tests/test_representational_resolution_build714.py \
              tests/test_comm_credit_phase_g_live_wiring.py \
              tests/test_communication_credit_unification.py \
              tests/test_zip_pipeline_learning_oets_promotion.py
            echo '=== resolution canaries ==='
            python aurora_build714_resolution_canaries.py
            echo '=== layer guard ==='
            python tests/test_layer_acyclicity.py
            echo '=== import smoke ==='
            AURORA_SKIP_DEP_INSTALL=1 python - <<'PY'
          import aurora
          import aurora_consciousness_engine
          import aurora_simulation_engine
          import aurora_governance_persistence_gateway
          print('Aurora core imports OK')
          PY
            echo '=== hard removal guards ==='
            ! grep -n "def _extract_semantic_topic" aurora_simulation_engine.py
            ! grep -n "def _derive_understanding" aurora_simulation_engine.py
            ! grep -n "def _stamp_crystal" aurora_simulation_engine.py
            ! grep -n "def inject_into_oets" aurora_simulation_engine.py
            ! grep -R -n --include='*.py' --exclude='apply.py' "\.inject_into_oets(" aurora_*.py tests
            grep -n "self.run_reflection_cycle(" aurora_internal/aurora_understanding_contract.py
            grep -n "fragment_count" aurora_sedimemory.py
            grep -n "Concept Crystals" flutter_app/lib/screens/hub_screen.dart
            grep -n "Timer.periodic" flutter_app/lib/habitat/habitat_gesture_layer.dart
          } >"$LOG" 2>&1
          RC=$?
          echo "exit_code=$RC" >> "$LOG"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          cp "$LOG" /tmp/build725-python-ci-preserved.log
          exit 0

      - name: Commit successful repair or exact failure log
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RC='${{ steps.build725.outputs.rc }}'
          if [ "$RC" = "0" ]; then
            git restore --staged --worktree aurora_state 2>/dev/null || true
            rm -rf .pytest_cache __pycache__ */__pycache__ */*/__pycache__
            rm -f .github/build725-repair/apply.py .github/build725-repair/run.log
            rmdir .github/build725-repair 2>/dev/null || true
            rm -f .github/workflows/apply-build725-learning-integration.yml
            git checkout origin/main -- .github/workflows/python-ci.yml
            git add -A
            git diff --cached --check
            git commit -m "Build 725: remove legacy learning contamination and repair live development wiring"
            git push origin HEAD:agent/build-724-learning-integration-repair
          else
            cp /tmp/build725-python-ci-preserved.log /tmp/run.log
            git reset --hard HEAD
            mkdir -p .github/build725-repair
            cp /tmp/run.log .github/build725-repair/run.log
            git add .github/build725-repair/run.log
            git commit -m "Record Build 725 repair gate failure"
            git push origin HEAD:agent/build-724-learning-integration-repair
          fi
