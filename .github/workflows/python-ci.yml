name: Build 725 verified publisher

on:
  push:
    branches:
      - 'claude/build725-publisher'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout publisher payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct Build 725 and apply to live main
        shell: bash
        run: |
          set -euo pipefail
          cat .github/build725-payload/part-* > /tmp/build725.patch.gz.b64
          base64 -d /tmp/build725.patch.gz.b64 | gzip -dc > /tmp/build725.patch
          git fetch --no-tags origin main:refs/remotes/origin/main
          BASE="$(git rev-parse refs/remotes/origin/main)"
          echo "$BASE" > /tmp/build725-base
          CURRENT_REPAIR="$(git ls-remote origin refs/heads/agent/build-724-learning-integration-repair | cut -f1)"
          echo "$CURRENT_REPAIR" > /tmp/build725-repair-before
          git reset --hard "$BASE"
          git apply --check /tmp/build725.patch
          git apply /tmp/build725.patch
          git diff --check

      - name: Install core test dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements-core.txt pytest

      - name: Run focused Build 725 regression battery
        env:
          AURORA_SKIP_DEP_INSTALL: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_build725_native_semantic_externalization.py \
            tests/test_afterthought_topic_identity_and_shard_collision_repair.py \
            tests/test_afterthought_topic_identity_and_shard_collision_live.py \
            tests/test_native_motivation_binding_build723.py \
            tests/test_habitat_motivation_build717.py \
            tests/test_habitat_discovery_canary_build717.py \
            tests/test_habitat_self_and_shared_canaries_build717.py \
            tests/test_representational_resolution_build714.py \
            tests/test_surface_does_not_wait_for_scout.py \
            tests/test_subsurface_presence_during_scout_delay.py \
            tests/test_articulation_semantic_strategy.py \
            tests/test_constraint_semantic_continuity.py \
            tests/test_communication_credit_unification.py \
            tests/test_communication_emergence.py \
            tests/test_nc2_strengthen_cascade.py \
            tests/test_relation_typing_probe_extension.py \
            tests/test_oets_conf.py \
            tests/test_reflexive_interpreter_sedimemory_boot_wiring.py \
            tests/test_understanding_sediment_overlay.py
          python aurora_build714_resolution_canaries.py
          python tests/test_layer_acyclicity.py
          python -m py_compile \
            aurora.py \
            aurora_habitat.py \
            aurora_habitat_motivation.py \
            aurora_internal/aurora_ontological_scaffolding.py \
            aurora_internal/aurora_understanding_contract.py \
            aurora_manifold_directory/noncomp_field.py \
            aurora_sedimemory.py \
            aurora_simulation_engine.py \
            flutter_app/android/app/src/main/python/aurora_bridge.py
          python - <<'PY'
          import aurora
          import aurora_consciousness_engine
          import aurora_simulation_engine
          import aurora_governance_persistence_gateway
          print('Aurora core imports OK')
          PY

      - name: Seal exact clean source delta and publish repair branch
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(cat /tmp/build725-base)"
          BEFORE="$(cat /tmp/build725-repair-before)"

          git restore --source="$BASE" --worktree --staged -- aurora_state 2>/dev/null || true
          rm -rf .pytest_cache __pycache__ */__pycache__ */*/__pycache__ */*/*/__pycache__
          git add -A

          cat > /tmp/expected-build725-files <<'EOF'
          aurora.py
          aurora_habitat.py
          aurora_habitat_motivation.py
          aurora_internal/aurora_ontological_scaffolding.py
          aurora_internal/aurora_understanding_contract.py
          aurora_manifold_directory/noncomp_field.py
          aurora_sedimemory.py
          aurora_simulation_engine.py
          flutter_app/android/app/src/main/python/aurora_bridge.py
          flutter_app/lib/habitat/habitat_gesture_layer.dart
          flutter_app/lib/screens/hub_screen.dart
          tests/test_afterthought_topic_identity_and_shard_collision_live.py
          tests/test_afterthought_topic_identity_and_shard_collision_repair.py
          tests/test_build725_native_semantic_externalization.py
          EOF
          sed -i 's/^          //' /tmp/expected-build725-files
          sort /tmp/expected-build725-files -o /tmp/expected-build725-files
          git diff --cached --name-only "$BASE" | sort > /tmp/actual-build725-files
          diff -u /tmp/expected-build725-files /tmp/actual-build725-files
          git diff --cached --check

          TREE="$(git write-tree)"
          CLEAN_COMMIT="$(printf '%s\n\n%s\n' \
            'Build 725: native semantic externalization and live interaction repair' \
            'Restore local semantic ancestry to externalization, remove legacy conversational contamination, preserve nonblocking deeper cognition, localize receiver-validated pressure relief, and reconcile telemetry/Habitat surfaces.' \
            | git commit-tree "$TREE" -p "$BASE")"

          NOW="$(git ls-remote origin refs/heads/agent/build-724-learning-integration-repair | cut -f1)"
          if [ "$NOW" != "$BEFORE" ]; then
            echo "Repair branch moved during verification: before=$BEFORE now=$NOW" >&2
            exit 1
          fi
          git push origin "$CLEAN_COMMIT":refs/heads/agent/build-724-learning-integration-repair \
            --force-with-lease=refs/heads/agent/build-724-learning-integration-repair:"$BEFORE"
          echo "Published clean Build 725 commit: $CLEAN_COMMIT"
