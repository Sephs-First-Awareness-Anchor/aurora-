name: Build 725 one-time Android release

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repaired main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Build 725 source is present
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'nonsemantic_outcome_evidence' aurora_simulation_engine.py
          grep -q '_manifold_semantic_resolution' aurora.py
          grep -q 'RECONCILED_PENDING_RECEIVER' aurora_internal/aurora_understanding_contract.py
          grep -q 'surface_renderable_count' aurora_habitat.py
          if grep -q 'def _extract_semantic_topic' aurora_simulation_engine.py; then
            echo 'Legacy semantic-topic parser is still executable.' >&2
            exit 1
          fi
          if grep -q 'def _derive_understanding' aurora_simulation_engine.py; then
            echo 'Legacy outcome-prose semantic authority is still executable.' >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK 25
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Write local.properties
        working-directory: flutter_app/android
        run: |
          printf "flutter.sdk=%s\nsdk.dir=%s\nndk.dir=%s\nndk.version=25.1.8937393\n" \
            "$FLUTTER_ROOT" "$ANDROID_SDK_ROOT" "$ANDROID_SDK_ROOT/ndk/25.1.8937393" > local.properties

      - name: Set up signing keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > ~/.android/release.keystore
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          fi

      - name: Build repaired Android APK
        working-directory: flutter_app
        env:
          RELEASE_STORE_PASS: ${{ secrets.RELEASE_STORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: |
          flutter pub get
          flutter clean
          flutter build apk --release -v
          cp build/app/outputs/flutter-apk/app-release.apk ../aurora-release.apk

      - name: Upload Build 725 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-build-725-apk
          path: aurora-release.apk

      - name: Create Build 725 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-725-${{ github.run_number }}
          name: Aurora Build 725.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: aurora-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}