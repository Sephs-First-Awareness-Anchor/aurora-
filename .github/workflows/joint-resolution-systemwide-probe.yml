name: Joint resolution systemwide read-only probe

on:
  pull_request:
    paths:
      - 'tests/test_joint_resolution_systemwide_probe.py'
      - 'aurora_representational_resolution.py'
      - 'aurora_habitat_motivation.py'
      - 'aurora_internal/crystal_facets.py'
      - 'aurora_internal/aurora_confluence.py'
      - 'aurora_internal/aurora_live_possibility_frontier.py'
      - '.github/workflows/joint-resolution-systemwide-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  systemwide-canary:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      AURORA_SKIP_DEP_INSTALL: '1'
      AURORA_SKIP_HARDWARE_IMPORTS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.:flutter_app/android/app/src/main/python'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt pytest
      - name: Exercise real Aurora module boundaries, without production mutations
        run: |
          python -m pytest -q -ra --tb=short tests/test_joint_resolution_systemwide_probe.py
