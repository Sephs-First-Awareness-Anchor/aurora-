name: Joint resolution systemwide read-only probe

on:
  pull_request:
    paths:
      - 'tests/test_joint_resolution_systemwide_probe.py'
      - 'aurora_representational_resolution.py'
      - 'aurora_habitat_motivation.py'
      - 'aurora_internal/crystal_facets.py'
      - 'aurora_internal/aurora_confluence.py'
      - 'aurora_internal/aurora_live_possibility_frontier.py'
      - '.github/workflows/joint-resolution-systemwide-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  systemwide-canary:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      AURORA_SKIP_DEP_INSTALL: '1'
      AURORA_SKIP_HARDWARE_IMPORTS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.:flutter_app/android/app/src/main/python'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt pytest
      - name: Exercise real Aurora module boundaries, without production mutations
        run: |
          python -m pytest -q -ra --tb=short tests/test_joint_resolution_systemwide_probe.py
      - name: Verify existing independently learned multi-relation reasoning and speech
        run: |
          python -m pytest -q --tb=short tests/test_learned_order_rules.py -k 'order_is_chained or questions_are_answered_from_chained_order or the_confluence_composes_the_answer or what_she_holds_under_a_condition_is_said'
      - name: Verify learned representations are distributed and judged by downstream consumers
        run: |
          python -m pytest -q --tb=short tests/test_representation_exchange.py -k 'any_subject_of_representation_can_use_it or a_consumer_reporting_harm_in_its_own_domain_blocks_earning'

