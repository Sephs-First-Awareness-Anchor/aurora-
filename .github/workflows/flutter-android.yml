name: Flutter Android Build

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'flutter_app/**'
      - '*.py'
      - 'aurora_internal/**'
      - 'aurora_support_stack.py'
      - 'foundational_contract.py'
      - '.github/workflows/flutter-android.yml'
      - '.github/build725-payload/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and seal Build 725 source repair
        shell: bash
        run: |
          set -euo pipefail
          BASE='24410ee84399431b5f0eac102b9659d485c20dd2'
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          cat .github/build725-payload/part-* > /tmp/build725.patch.gz.b64
          base64 -d /tmp/build725.patch.gz.b64 | gzip -dc > /tmp/build725.patch
          git apply --check /tmp/build725.patch
          git apply /tmp/build725.patch

          git checkout "$BASE" -- .github/workflows/flutter-android.yml
          git rm -rf .github/build725-payload
          git restore --source="$BASE" --worktree --staged -- aurora_state 2>/dev/null || true
          rm -rf .pytest_cache __pycache__ */__pycache__ */*/__pycache__ */*/*/__pycache__
          git add -A

          cat > /tmp/expected-build725-files <<'EOF'
          aurora.py
          aurora_habitat.py
          aurora_habitat_motivation.py
          aurora_internal/aurora_ontological_scaffolding.py
          aurora_internal/aurora_understanding_contract.py
          aurora_manifold_directory/noncomp_field.py
          aurora_sedimemory.py
          aurora_simulation_engine.py
          flutter_app/android/app/src/main/python/aurora_bridge.py
          flutter_app/lib/habitat/habitat_gesture_layer.dart
          flutter_app/lib/screens/hub_screen.dart
          tests/test_afterthought_topic_identity_and_shard_collision_live.py
          tests/test_afterthought_topic_identity_and_shard_collision_repair.py
          tests/test_build725_native_semantic_externalization.py
          EOF
          sed -i 's/^          //' /tmp/expected-build725-files
          sort /tmp/expected-build725-files -o /tmp/expected-build725-files
          git diff --cached --name-only "$BASE" | sort > /tmp/actual-build725-files
          diff -u /tmp/expected-build725-files /tmp/actual-build725-files
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build 725: native semantic externalization and live interaction repair"
          git push origin HEAD:main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK 25
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Write local.properties
        working-directory: flutter_app/android
        run: |
          printf "flutter.sdk=%s\nsdk.dir=%s\nndk.dir=%s\nndk.version=25.1.8937393\n" \
            "$FLUTTER_ROOT" "$ANDROID_SDK_ROOT" "$ANDROID_SDK_ROOT/ndk/25.1.8937393" > local.properties

      - name: Set up signing keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > ~/.android/release.keystore
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          fi

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Clean Flutter build
        working-directory: flutter_app
        run: flutter clean

      - name: Build APK (release)
        working-directory: flutter_app
        env:
          RELEASE_STORE_PASS: ${{ secrets.RELEASE_STORE_PASS }}
          RELEASE_KEY_ALIAS:  ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS:   ${{ secrets.RELEASE_KEY_PASS }}
        run: |
          flutter build apk --release -v
          cp build/app/outputs/flutter-apk/app-release.apk ../aurora-release.apk

      - name: List output for verification
        run: ls -lh *.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aurora Build ${{ github.run_number }}
          files: aurora-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
