name: PR-triggered phone regression repair

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Extract and apply staged repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          raw = Path('.github/workflows/one-shot-phone-regression-repair.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = raw.index(start_marker) + len(start_marker)
          end = raw.index(end_marker, start)
          code = textwrap.dedent(raw[start:end])
          exec(compile(code, '<staged-phone-repair>', 'exec'), {})
          PY

      - name: Compile and run focused regression suite
        shell: bash
        run: |
          python -m py_compile \
            aurora.py \
            aurora_boundary_hypothesis.py \
            aurora_internal/aurora_constraint_semantic_continuity.py \
            flutter_app/android/app/src/main/python/aurora_bridge.py
          pytest -q \
            tests/test_boundary_hypothesis_and_vocative_stripping.py \
            tests/test_boundary_surface_and_study_trace_regressions.py \
            tests/test_android_surface_subsurface_reconnection.py

      - name: Commit repaired branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aurora.py \
            aurora_boundary_hypothesis.py \
            aurora_internal/aurora_constraint_semantic_continuity.py \
            flutter_app/android/app/src/main/python/aurora_bridge.py \
            flutter_app/lib/screens/hub_screen.dart \
            tests/test_boundary_hypothesis_and_vocative_stripping.py \
            tests/test_android_surface_subsurface_reconnection.py
          git commit -m "fix: close confirmed phone turn regressions"
          git push origin HEAD:${{ github.head_ref }}
