name: Aurora Clones

# Authors: Sunni (Sir) Morningstar & Cael Devo
#
# FIX-A105 -- many Auroras rehearse her history; she takes in what they carved.
#
# Each clone job boots her from this repository's state and lives a contiguous
# stretch of whole conversations from her experiential history through her own
# HistoricalExperienceEnvironment: witnessing every event and rehearsing
# Sunni's side (she answers the other side; Sunni's real reply judges her
# through the same receiver path as the messenger).  Same machinery as her
# phone, nothing else.
#
# The merge job combines what the clones carved -- paths several clones carved
# arrive with the weight of that convergence; divergent landings are kept as
# divergences; operations / lexical candidates union their validated evidence;
# unformed patterns join by core -- and commits it as
# aurora_internal/aurora_clone_harvest.jsonl.gz, then starts an app build.  On
# her phone the harvest is absorbed once at boot through each organ's own
# rules (nothing arrives promoted), and her history stream stops spending a
# full turn re-rehearsing the conversations the clones already lived.
#
# Conversations already lived by an earlier harvest are skipped automatically,
# so running this again continues where the last run stopped.
#
# FIX-A115: clones report motif lineage, propositions (who asserted what) and
# concept positions too.  `organs` chooses what a run reports; history lived
# before an organ existed is re-lived for that organ only (e.g. organs =
# "motifs,propositions,concepts"), so nothing already harvested counts twice.
# Each run is APPENDED to the harvest file as its own segment; her phone
# absorbs every segment it has not absorbed yet.

on:
  workflow_dispatch:
    inputs:
      clone_count:
        description: "How many clones (each takes an equal share of the not-yet-lived conversations)"
        required: false
        default: "100"
      clones_per_job:
        description: "Clones living side by side on one runner (4 cores, 16 GB; one Aurora uses ~1 core)"
        required: false
        default: "6"
      max_minutes:
        description: "Per-clone budget in minutes (a clone stops only between conversations)"
        required: false
        default: "290"
      organs:
        description: "What clones report: all, or a comma list of paths,operations,candidates,unformed,motifs,propositions,concepts"
        required: false
        default: "all"
      max_parallel:
        description: "Runners at once (public repos get 20 free concurrent jobs; leave room for builds)"
        required: false
        default: "17"
      build_app:
        description: "Start an Aurora app build with the new harvest"
        required: false
        default: "true"

concurrency:
  group: aurora-clones
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.plan.outputs.indices }}
    steps:
      - id: plan
        run: |
          # One matrix entry per RUNNER; each runner hosts clones_per_job clones
          # (Sunni, 2026-11-09: several clones per job -- one Aurora uses about
          # one of a runner's 4 cores, so one clone per runner left 3 idle).
          python3 -c "import json, math; n=int('${{ github.event.inputs.clone_count || '100' }}'); k=max(1, int('${{ github.event.inputs.clones_per_job || '6' }}')); print('indices=' + json.dumps(list(range(math.ceil(n / k)))))" >> "$GITHUB_OUTPUT"

  clone:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(github.event.inputs.max_parallel || '17') }}
      matrix:
        index: ${{ fromJSON(needs.plan.outputs.indices) }}
    steps:
      - name: Checkout her state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Live these clones' shares of her history, side by side
        env:
          AURORA_SKIP_DEP_INSTALL: "1"
          PYTHONPATH: ".:flutter_app/android/app/src/main/python"
          # One core each: no BLAS thread pools fighting over the runner's 4.
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          count=${{ github.event.inputs.clone_count || '100' }}
          per=${{ github.event.inputs.clones_per_job || '6' }}
          budget=$(( ${{ github.event.inputs.max_minutes || '290' }} * 60 ))
          job=${{ matrix.index }}
          mkdir -p "$GITHUB_WORKSPACE/yields"
          for k in $(seq 0 $(( per - 1 ))); do
            i=$(( job * per + k ))
            if [ "$i" -ge "$count" ]; then break; fi
            # Each clone needs its own copy of her: she writes her state and
            # even her own source files as she lives.
            d="$RUNNER_TEMP/clone-$i"
            mkdir -p "$d"
            tar --exclude=./.git --exclude=./yields -cf - . | tar -xf - -C "$d"
            ( cd "$d" && python -m aurora_internal.aurora_clone_harvest clone \
                --index "$i" --count "$count" --max-seconds "$budget" \
                --organs "${{ github.event.inputs.organs || 'all' }}" \
                --out "$GITHUB_WORKSPACE/yields/clone-$i.json.gz" \
                > "$GITHUB_WORKSPACE/yields/clone-$i.log" 2>&1 ) &
            sleep 20                     # stagger the boots
          done
          wait
          for f in "$GITHUB_WORKSPACE"/yields/clone-*.log; do
            echo "== $f"; grep -E "^clone [0-9]+(/| done)|Traceback|Error" "$f" | tail -4
          done
          ls -la "$GITHUB_WORKSPACE/yields"

      - name: Hand back what they carved
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clone-yield-${{ matrix.index }}
          path: yields/
          retention-days: 7
          if-no-files-found: warn

  merge:
    needs: [plan, clone]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Gather the clones' yields
        uses: actions/download-artifact@v4
        with:
          pattern: clone-yield-*
          merge-multiple: true
          path: yields

      - name: Merge by convergence
        id: merge
        env:
          AURORA_SKIP_DEP_INSTALL: "1"
          PYTHONPATH: ".:flutter_app/android/app/src/main/python"
        run: |
          shopt -s nullglob
          files=(yields/*.json.gz)
          echo "yields: ${#files[@]}"
          if [ ${#files[@]} -eq 0 ]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m aurora_internal.aurora_clone_harvest merge \
            --out aurora_internal/aurora_clone_harvest.jsonl.gz "${files[@]}"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Commit the harvest
        if: steps.merge.outputs.merged == 'true'
        run: |
          git config user.name  "aurora-clones"
          git config user.email "aurora-clones@users.noreply.github.com"
          git add -f aurora_internal/aurora_clone_harvest.jsonl.gz
          if git diff --cached --quiet; then
            echo "harvest unchanged"
            exit 0
          fi
          git commit -m "Clone harvest: ${{ github.event.inputs.clone_count || '100' }} clones (run ${{ github.run_number }})"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $(( attempt * 10 ))
          done
          exit 1

      - name: Start an app build with it
        if: steps.merge.outputs.merged == 'true' && (github.event.inputs.build_app || 'true') == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Pushes made with the workflow token do not trigger other workflows;
        # a workflow_dispatch does.
        run: gh workflow run flutter-android.yml --ref main
