name: PR264 final knowledge-graph regeneration

on:
  push:
    branches: [claude/aurora-integration-20261118]
    paths: [docs/PR264_GRAPH_REBUILD_TRIGGER.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr264-graph-finalize
  cancel-in-progress: false

jobs:
  graph:
    name: Rebuild, diff, audit and commit final architecture
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile explicit source inventory and derive its real dependency map
        run: |
          python scripts/aurora_pr264_finalize_manifest.py
          python scripts/render_module_ownership.py --update-derived
          python scripts/render_module_ownership.py
          python scripts/render_module_ownership.py --check
      - name: Rebuild canonical knowledge graph at this branch head
        run: |
          # Keep the committed runtime evidence: without --runtime the graph drops every
          # observed call and thread, and the observed-loss guard below can never fire.
          python scripts/aurora_knowledge_graph.py build --runtime knowledge_graph/runtime --quiet
          python scripts/aurora_knowledge_graph.py check --runtime knowledge_graph/runtime
      - name: Recompute real comparison against frozen KG branch base
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/pr264-kg-base" b649850b28ff7e94f4da2447bb23c3804ea68450
          python scripts/aurora_knowledge_graph.py build \
            --root "$RUNNER_TEMP/pr264-kg-base" \
            --out "$RUNNER_TEMP/pr264-base-graph" \
            --runtime "$RUNNER_TEMP/pr264-kg-base/knowledge_graph/runtime" --quiet
          python scripts/aurora_knowledge_graph.py diff \
            "$RUNNER_TEMP/pr264-base-graph" knowledge_graph \
            --out knowledge_graph/comparisons/PR264_FINAL_COMPARISON.md
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          path = Path('knowledge_graph/comparisons/PR264_FINAL_COMPARISON.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          lost = report['relationships']['lost']
          kinds = dict(Counter(row['type'] for row in lost))
          # Observed losses already traced to an intentional replacement are listed,
          # with their evidence, in PR264_VERIFIED_REPLACEMENTS.json. Only exact
          # matches are subtracted; every other observed loss still fails the job.
          verified_path = Path('knowledge_graph/comparisons/PR264_VERIFIED_REPLACEMENTS.json')
          verified = set()
          if verified_path.exists():
              for row in json.loads(verified_path.read_text(encoding='utf-8'))['replacements']:
                  verified.add((row['source'], row['type'], row['target']))
          observed_rows = [row for row in lost if row.get('observed')]
          unverified = [row for row in observed_rows
                        if (row['source'], row['type'], row['target']) not in verified]
          print('Final unresolved relationships:',len(lost), 'by kind:',kinds)
          print('Previously runtime-observed among unresolved:', len(observed_rows),
                '(verified replacements:', len(observed_rows) - len(unverified), ')')
          for row in unverified:
              print('  unverified:', row['source'], row['type'], row['target'])
          if unverified:
              raise SystemExit('Observed runtime relationship loss requires investigation')
          PY
      - name: Publish committed architecture snapshot on this integration branch
        run: |
          git add -A knowledge_graph docs/module_ownership.json docs/LAYER_MODULE_OWNERSHIP.md
          # The comparison report uses Markdown hard line breaks (two trailing spaces) by
          # design, so whitespace is checked on everything except generated reports.
          git diff --cached --check -- . ':(exclude)knowledge_graph/comparisons/*.md'
          if git diff --cached --quiet; then
            echo "No graph changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate PR264 architecture graph and final baseline comparison"
            git push origin HEAD:refs/heads/claude/aurora-integration-20261118
          fi
          python scripts/aurora_knowledge_graph.py check --runtime knowledge_graph/runtime
