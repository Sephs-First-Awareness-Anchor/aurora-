name: PR264 integration stabilization

on:
  push:
    branches:
      - claude/aurora-integration-20261118
    paths:
      - 'aurora.py'
      - 'aurora_internal/**'
      - 'aurora_*.py'
      - 'aurora_manifold_directory/**'
      - 'flutter_app/android/app/src/main/python/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/pr264-stabilization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Birth725 Praxis reflection strata regression
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      AURORA_SKIP_DEP_INSTALL: '1'
      AURORA_SKIP_HARDWARE_IMPORTS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum test and core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt pytest pytest-timeout psutil pyflakes
      - name: Verify module syntax; report stale graph before regeneration
        run: |
          python -m compileall -q aurora.py aurora_internal scripts tests
          python scripts/aurora_knowledge_graph.py check || echo 'GRAPH_STALE: pending regeneration on final code'
      - name: Test semantic externalization, reflection, Praxis and desktop host
        run: |
          python -m pytest -q -ra --tb=short --timeout=240 --continue-on-collection-errors \
            tests/test_build725_native_semantic_externalization.py \
            tests/test_reflective_readdressing.py \
            tests/test_reflective_introspection_misrouting_repair.py \
            tests/test_reflective_introspection_misrouting_live.py \
            tests/test_praxis_messenger.py \
            tests/test_praxis_shared_state_and_discovery.py \
            tests/test_praxis_same_device_loop.py \
            tests/test_desktop_embodiment.py \
            tests/test_desktop_praxis_home_boot.py \
            tests/test_strata_fencing.py \
            tests/test_strata_state_transfer.py
